name: Garmin sync

on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours
  workflow_dispatch:
    inputs:
      days:
        description: "How many days back to sync"
        default: "7"
      since:
        description: "Or backfill from this date (YYYY-MM-DD) - overrides days"
        default: ""

concurrency:
  group: garmin-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sync/requirements.txt
      - run: pip install -r sync/requirements.txt
      - name: Run sync
        working-directory: sync
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
          DAYS: ${{ github.event.inputs.days || '7' }}
          SINCE: ${{ github.event.inputs.since || '' }}
        run: |
          if [ -n "$SINCE" ]; then
            python sync.py --since "$SINCE"
          else
            python sync.py --days "$DAYS"
          fi
